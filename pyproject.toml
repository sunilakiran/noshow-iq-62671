[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow-iq-62671"
version = "0.3.0"
description = "Patient no-show prediction API for clinics"
authors = [{name = "sunilakiran"}]
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "flask",
    "pymongo",
    "scikit-learn",
    "pandas",
    "numpy",
    "imbalanced-learn",
    "joblib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["noshow_iq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_preprocess.py"]